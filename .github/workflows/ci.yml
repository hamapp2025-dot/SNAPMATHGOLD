name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing-page/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing-page dependencies
        run: npm --prefix landing-page ci

      - name: Run release preflight
        run: npm run release:preflight

      - name: Validate landing page
        run: npm run check:landing
