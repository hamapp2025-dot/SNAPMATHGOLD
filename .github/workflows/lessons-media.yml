name: Lessons Media Pipeline

on:
  push:
    paths:
      - src/data/grade12.ts
      - tools/lesson_hero_catalog.json
      - tools/generate_launch_media.py
      - scripts/generate-lesson-media-overrides.js
      - scripts/lessons-pipeline-all.js
      - .github/workflows/lessons-media.yml
  workflow_dispatch:

jobs:
  sync-lesson-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python media deps
        run: pip install pillow imageio imageio-ffmpeg arabic-reshaper python-bidi

      - name: Install root dependencies
        run: npm ci

      - name: Regenerate lesson catalog and media registry
        run: npm run lessons:pipeline -- --skip-heroes

      - name: Verify all lessons have overrides
        run: node -e "const fs=require('fs'); const t=fs.readFileSync('src/media/lessonMediaOverrides.generated.ts','utf8'); const n=(t.match(/'u\\d+-l\\d+'/g)||[]).length; if(n<24) throw new Error('expected 24 lesson overrides, got '+n); console.log('lesson overrides', n);"

      - name: Upload lesson media registry
        uses: actions/upload-artifact@v4
        with:
          name: lesson-media-overrides
          path: |
            src/media/lessonMediaOverrides.generated.ts
            tools/lesson_hero_catalog.json
